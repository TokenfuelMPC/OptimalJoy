<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OptimalJoy · Aurora — Wellness &amp; Aesthetics</title>
<meta name="description" content="OptimalJoy Wellness & Aesthetics — Maryville, TN. Medical weight loss, hormone therapy, fillers, and more."/>
<link rel="icon" href="../../assets/logo/Optimal-Joy-Logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bronze:#C4926b; --bronze-d:#a9774f; --teal:#38C5B5; --teal-d:#2DA194;
  --blush:#f6e7da; --cream:#fbf7f2; --ink:#221a33; --plum:#1a1230;
  --text:#5f5868; --muted:#9b94a6; --line:#ece2d8; --white:#fff;
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --r:24px; --sh:0 24px 60px rgba(34,26,51,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);background:var(--cream);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);font-weight:500;line-height:1.12;letter-spacing:-.01em}
.serif-it{font-style:italic;font-weight:400}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
section{padding:104px 0;position:relative}
[id]{scroll-margin-top:96px}
.eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:.24em;font-size:.74rem;font-weight:700;color:var(--bronze)}
.btn{font-family:var(--sans);display:inline-flex;align-items:center;gap:.5em;background:var(--ink);color:#fff;font-weight:600;padding:.95rem 1.9rem;border-radius:100px;border:none;cursor:pointer;transition:.25s;font-size:.96rem}
.btn:hover{background:var(--bronze);transform:translateY(-3px);box-shadow:0 14px 30px rgba(196,146,107,.35)}
.btn.light{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn.light:hover{background:var(--bronze);color:#fff}
.reveal{opacity:0;transform:translateY(34px);transition:.8s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}

/* blobs */
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0;pointer-events:none}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(251,247,242,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:84px}
.nav img{height:48px}
.nav .btn{padding:.46rem 1rem;font-size:.76rem;font-weight:600;background:transparent;color:var(--ink);border:1.5px solid var(--bronze)}
.nav .btn:hover{background:var(--bronze);color:#fff;transform:none;box-shadow:none}
.links{display:flex;gap:34px;align-items:center}
.links a{font-weight:600;font-size:.94rem;color:var(--ink);position:relative}
.links a::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:var(--bronze);transition:.3s}
.links a:hover::after{width:100%}
.burger{display:none;background:none;border:none;font-size:1.6rem;color:var(--ink);cursor:pointer}

/* hero */
.hero{padding:70px 0 90px;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
.hero h1{font-size:clamp(2.7rem,6vw,5rem);color:var(--ink);margin:.5rem 0 1.2rem}
.hero p{font-size:1.12rem;max-width:30rem;margin-bottom:2rem}
.hero .cta-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.hero-media{position:relative;max-width:350px;margin:0 auto}
.hero-media .main{border-radius:140px 140px 32px 32px;box-shadow:var(--sh);aspect-ratio:4/5;object-fit:cover;width:100%}
.chip{position:absolute;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;font-family:var(--sans)}
.chip b{font-family:var(--serif);font-size:1.4rem;color:var(--ink);display:block;line-height:1}
.chip span{font-size:.78rem;color:var(--muted)}
.chip.tl{top:30px;left:-26px}
.chip.br{bottom:34px;right:-22px}
.chip .dot{width:38px;height:38px;border-radius:50%;background:var(--blush);display:grid;place-items:center;color:var(--bronze);font-weight:800}

/* marquee features */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.fcard{background:#fff;border-radius:var(--r);padding:38px 32px;border:1px solid var(--line);transition:.3s}
.fcard:hover{transform:translateY(-8px);box-shadow:var(--sh)}
.fcard .ic{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--blush),#fff);display:grid;place-items:center;color:var(--bronze);font-family:var(--serif);font-size:1.5rem;margin-bottom:20px;border:1px solid var(--line)}
.fcard h3{font-size:1.45rem;margin-bottom:.5rem}

/* intro band */
.band{background:#fff;border-radius:40px;margin:0 28px;padding:0}
.intro{text-align:center;max-width:760px;margin:0 auto}
.intro h2{font-size:clamp(2rem,4vw,3rem)}

/* value props */
.vp{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:46px}
.vp .v{text-align:center;padding:0 14px}
.vp .v .n{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--cream);border:1px solid var(--line);color:var(--teal-d);font-family:var(--serif);font-size:1.4rem}
.vp .v h3{font-size:1.3rem;margin-bottom:.4rem}

/* practitioner */
.pract{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:center}
.pract img{border-radius:32px;box-shadow:var(--sh)}
.pract h2{font-size:clamp(2rem,4vw,3rem);margin:.4rem 0 1rem}
.pract .role{font-family:var(--sans);color:var(--bronze);font-weight:700;letter-spacing:.02em}

/* treatments */
.tcar-wrap{position:relative;margin-top:44px}
.tcar{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:6px 2px 16px;scrollbar-width:none}
.tcar::-webkit-scrollbar{display:none}
.tcar-nav{position:absolute;top:-66px;right:8px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-size:1.4rem;line-height:1;display:grid;place-items:center;transition:.2s}
.tcar-nav.prev{right:62px}
.tcar-nav:hover{background:var(--bronze);color:#fff;border-color:var(--bronze)}
.t{flex:0 0 268px;scroll-snap-align:start;background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);transition:.35s;display:flex;flex-direction:column}
.t:hover{transform:translateY(-8px);box-shadow:var(--sh)}
.t .im{height:158px;overflow:hidden}
.t .im img{width:100%;height:100%;object-fit:cover;transition:.5s}
.t:hover .im img{transform:scale(1.07)}
.t .bd{padding:26px;display:flex;flex-direction:column;flex:1}
.t h3{font-size:1.3rem;margin-bottom:.5rem}
.t p{font-size:.92rem;margin-bottom:18px}
.t .lk{margin-top:auto;font-family:var(--sans);font-weight:700;color:var(--bronze);font-size:.9rem}

/* steps */
.steps-w{background:linear-gradient(160deg,var(--plum),#2c2147);border-radius:40px;margin:0 28px;color:#fff;overflow:hidden;position:relative}
.steps-w .eyebrow{color:var(--teal)}
.steps-w h2{color:#fff}
.stp{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin-top:42px}
.stp .s .n{font-family:var(--serif);font-size:3.4rem;color:var(--bronze);opacity:.9}
.stp .s h3{color:#fff;font-size:1.5rem;margin:.2rem 0 .5rem}
.stp .s p{color:#cfc6dc}

/* testimonials */
.tst{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:48px}
.q{background:#fff;border-radius:var(--r);padding:40px;border:1px solid var(--line);position:relative}
.q .mk{font-family:var(--serif);font-size:4rem;color:var(--blush);line-height:.6;height:30px}
.q p{font-style:italic;font-family:var(--serif);font-size:1.18rem;color:var(--ink);margin:10px 0 18px}
.q .who{font-family:var(--sans);font-weight:700;color:var(--ink)}
.q .stars{color:var(--bronze);letter-spacing:3px;font-size:.9rem}

/* cta */
.final{text-align:center;background:radial-gradient(circle at 50% 0,var(--blush),var(--cream));border-radius:40px;margin:0 28px}
.final h2{font-size:clamp(2.2rem,5vw,3.6rem);max-width:18ch;margin:0 auto 1.4rem}

/* footer */
footer{background:var(--plum);color:#cdc4dd;padding:80px 0 34px;margin-top:60px}
footer .cols{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:48px}
footer img{height:54px;margin-bottom:20px}
footer h4{font-family:var(--sans);color:#fff;font-size:.92rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
footer a:hover{color:var(--bronze)}
footer .soc{display:flex;gap:12px;margin-top:18px}
footer .soc a{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#fff}
footer .soc a:hover{background:var(--bronze)}
.fb{border-top:1px solid rgba(255,255,255,.12);margin-top:46px;padding-top:24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--muted)}

.badge{position:fixed;left:14px;bottom:14px;z-index:60;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh);font-size:.72rem;padding:8px 14px;border-radius:100px;font-weight:700;font-family:var(--sans)}
.switch{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;gap:6px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);border-radius:100px;padding:6px;font-family:var(--sans)}
.switch a{font-size:.74rem;font-weight:700;padding:7px 12px;border-radius:100px;color:var(--muted)}
.switch a.on{background:var(--ink);color:#fff}

@media(max-width:920px){
  .burger{display:block}
  .nav img{height:42px}
  .nav .btn{margin-left:auto;padding:.7rem 1.1rem;font-size:.82rem;white-space:nowrap}
  .links{position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:rgba(251,247,242,.98);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:var(--sh);padding:8px 0;display:none}
  header.nav-open .links{display:flex}
  .links a{padding:15px 28px;font-size:1.06rem;border-bottom:1px solid var(--line)}
  .links a:last-child{border-bottom:none}
  .links a::after{display:none}
  .hero .grid,.pract,.feat,.vp,.stp,.tst,footer .cols{grid-template-columns:1fr}
  .pract img{order:-1}.chip.tl{left:8px}.chip.br{right:8px}
  .tcar-nav{display:none}.t{flex-basis:260px}
  section{padding:72px 0}.band,.steps-w,.final{margin:0 14px}
}
@media(max-width:560px){
  .wrap{padding:0 20px}.hero h1{font-size:2.4rem}
  .nav img{height:36px}.nav .btn{padding:.58rem .85rem;font-size:.76rem}
  .chip{padding:10px 12px}.chip b{font-size:1.15rem}.chip span{font-size:.7rem}
  .hero-media .main{border-radius:90px 90px 24px 24px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="badge">Aurora · Concept 1</div>
<div class="switch"><a class="on" href="../aurora/">Aurora</a><a href="../elan/">Élan</a><a href="../summit/">Summit</a></div>
<script>
const J=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const BOOK="https://www.optimantra.com/optimus/om/patient/login";
const SITE="https://www.optimaljoylife.com";
function toggleNav(btn){const h=document.querySelector('header');const open=h.classList.toggle('nav-open');if(btn)btn.innerHTML=open?'✕':'☰';}
function closeNav(){const h=document.querySelector('header');if(h)h.classList.remove('nav-open');const b=document.querySelector('.burger');if(b)b.innerHTML='☰';}
function scrollTreat(btn,dir){const car=btn.closest('.tcar-wrap').querySelector('.tcar');const c=car.querySelector('.t');const step=c?c.getBoundingClientRect().width+22:290;car.scrollBy({left:dir*step,behavior:'smooth'});}
fetch('../../manifest.json').then(r=>r.json()).then(render).catch(e=>{document.getElementById('app').innerHTML='<p style="padding:80px;text-align:center">Could not load manifest.json — '+J(e.message)+'</p>';});
function render(m){
  const hs=m.homepage.sections, id=x=>hs.find(s=>s.id===x);
  const slides=id('feature-slides').slides, vp=id('value-props').items, pr=id('practitioner'),
        steps=id('steps'), welcome=id('welcome'), tst=id('testimonials');
  document.getElementById('app').innerHTML=`
  <header><div class="wrap nav">
    <a href="#top"><img src="../../assets/logo/Optimal-Joy-Logo.svg" alt="${J(m.site.name)}"></a>
    <nav class="links"><a href="#treatments">Treatments</a><a href="#about">Meet Traci</a><a href="#process">How It Works</a><a href="#contact">Contact</a></nav>
    <a class="btn" href="${BOOK}" target="_blank" rel="noopener">Book Appointment</a>
    <button class="burger" aria-label="Menu" onclick="toggleNav(this)">&#9776;</button>
  </div></header>
  <a id="top"></a>

  <section class="hero"><div class="blob" style="width:520px;height:520px;background:var(--blush);top:-120px;right:-120px"></div>
  <div class="blob" style="width:420px;height:420px;background:#d8f3ee;bottom:-160px;left:-140px"></div>
  <div class="wrap grid">
    <div class="reveal">
      <span class="eyebrow">${J(id('hero').tagline)}</span>
      <h1>Reveal your <span class="serif-it">most radiant</span> self.</h1>
      <p>${J(welcome.body)}</p>
      <div class="cta-row">
        <a class="btn" href="${BOOK}" target="_blank" rel="noopener">Book Appointment →</a>
        <a class="btn light" href="#treatments">Explore Treatments</a>
      </div>
    </div>
    <div class="hero-media reveal">
      <img class="main" src="../../assets/images/introduction-image.jpg" alt="Radiant OptimalJoy patient">
      <div class="chip tl"><div class="dot">★</div><div><b>5.0</b><span>Client rated</span></div></div>
      <div class="chip br"><div class="dot">7</div><div><b>Treatments</b><span>Wellness & aesthetics</span></div></div>
    </div>
  </div></section>

  <section style="padding-top:30px"><div class="wrap">
    <div class="feat">${slides.map((s,i)=>`<div class="fcard reveal" style="transition-delay:${i*90}ms"><div class="ic">${['✦','◆','❋'][i]||'✦'}</div><h3>${J(s.title)}</h3><p>${J(s.body)}</p></div>`).join('')}</div>
  </div></section>

  <section class="band"><div class="wrap"><div class="intro reveal">
    <span class="eyebrow">${J(m.site.tagline)}</span>
    <h2 style="margin:.5rem 0 1rem">${J(welcome.heading)}</h2>
    <p style="font-size:1.1rem">${J(welcome.body)}</p>
    <div class="vp">${vp.map((v,i)=>`<div class="v"><div class="n">${['◇','♡','✓'][i]||'•'}</div><h3>${J(v.title)}</h3><p>${J(v.body)}</p></div>`).join('')}</div>
  </div></div></section>

  <section id="about"><div class="wrap pract">
    <img class="reveal" src="../../assets/images/practitioner-traci.jpg" alt="${J(pr.name)}">
    <div class="reveal">
      <span class="eyebrow">${J(pr.eyebrow)}</span>
      <h2>${J(pr.name.split(' ').slice(0,2).join(' '))} <span class="serif-it">${J(pr.name.split(' ').slice(2).join(' '))}</span></h2>
      <p class="role" style="margin-bottom:1rem">Founder &amp; Lead Practitioner</p>
      <p style="font-size:1.08rem">${J(pr.body)}</p>
      <a class="btn" style="margin-top:1.4rem" href="${BOOK}" target="_blank" rel="noopener">Book With Traci</a>
    </div>
  </div></section>

  <section id="treatments" style="background:#fff"><div class="wrap">
    <div class="intro reveal"><span class="eyebrow">What We Offer</span><h2 style="margin-top:.4rem">${J(id('treatments').heading)}</h2></div>
    <div class="tcar-wrap reveal"><button class="tcar-nav prev" aria-label="Previous" onclick="scrollTreat(this,-1)">‹</button><button class="tcar-nav next" aria-label="Next" onclick="scrollTreat(this,1)">›</button>
      <div class="tcar">${m.treatments.map(t=>`<div class="t"><div class="im"><img src="../../${t.image}" alt="${J(t.name)}" loading="lazy"></div><div class="bd"><h3>${J(t.name)}</h3><p>${J(t.blurb)}</p><a class="lk" href="${SITE}${t.path}" target="_blank" rel="noopener">Learn more →</a></div></div>`).join('')}</div></div>
  </div></section>

  <section class="steps-w" id="process"><div class="wrap" style="padding:84px 0">
    <div class="intro reveal"><span class="eyebrow">${J(steps.intro?'Simple Process':'')}</span><h2 style="margin-top:.4rem">${J(steps.heading)}</h2><p style="color:#cfc6dc">${J(steps.intro)}</p></div>
    <div class="stp">${steps.steps.map(s=>`<div class="s reveal"><div class="n">${J(s.num)}</div><h3>${J(s.title)}</h3><p>${J(s.body)}</p></div>`).join('')}</div>
  </div></section>

  <section><div class="wrap">
    <div class="intro reveal"><span class="eyebrow">${J(tst.heading)}</span><h2 style="margin-top:.4rem">${J(tst.subheading)}</h2></div>
    <div class="tst">${m.testimonials.map(q=>`<div class="q reveal"><div class="mk">&ldquo;</div><div class="stars">${'★'.repeat(q.rating||5)}</div><p>${J(q.quote)}</p><div class="who">${J(q.name)}</div></div>`).join('')}</div>
  </div></section>

  <section class="final"><div class="wrap reveal">
    <span class="eyebrow">${J(m.site.tagline)}</span>
    <h2 style="margin-top:.6rem">${J(id('final-cta').heading)}</h2>
    <a class="btn" href="${BOOK}" target="_blank" rel="noopener">${J(id('final-cta').cta)} →</a>
  </div></section>

  <footer id="contact"><div class="wrap">
    <div class="cols">
      <div><img src="../../assets/logo/Optimal-Joy-Logo-WHITE.svg" alt="${J(m.site.name)}"><p>${J(m.footer.description)}</p>
        <div class="soc">${m.social.map(s=>`<a href="${s.url}" target="_blank" rel="noopener" title="${J(s.platform)}">${s.platform[0]}</a>`).join('')}</div></div>
      <div><h4>Visit</h4><p>${J(m.contact.address.street)}<br>${J(m.contact.address.city)}, ${J(m.contact.address.state)} ${J(m.contact.address.zip)}</p><p style="margin-top:10px">${J(m.contact.hours)}</p></div>
      <div><h4>Contact</h4><p><strong>${J(m.contact.phone)}</strong> <span style="color:var(--muted)">(${J(m.contact.phoneNote)})</span></p><p><a href="mailto:${m.contact.email}">${J(m.contact.email)}</a></p></div>
    </div>
    <div class="fb"><div>&copy; ${J(m.meta.generated.slice(0,4))} ${J(m.site.name)} · ${m.footer.legal.map(l=>`<a href="${SITE}${l.path}" target="_blank" rel="noopener">${J(l.label)}</a>`).join(' · ')}</div><div>Concept: Aurora</div></div>
  </div></footer>`;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  document.querySelectorAll('.links a').forEach(a=>a.addEventListener('click',closeNav));
}
</script>
</body>
</html>
