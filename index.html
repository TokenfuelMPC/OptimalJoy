<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OptimalJoy Wellness &amp; Aesthetics — Maryville, TN</title>
<meta name="description" content="OptimalJoy Wellness & Aesthetics in Maryville, TN — medical weight loss, hormone replacement therapy, dermal fillers, microneedling and more. Safe, effective, affordable care." />
<link rel="icon" href="assets/logo/Optimal-Joy-Logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bronze:#C4926b; --bronze-dark:#af815d; --teal:#38C5B5; --teal-dark:#2DA194;
    --gold:#f2af29; --ink:#1a1230; --ink-2:#110c1d; --text:#666666; --muted:#ADB5B7;
    --line:#ece6df; --cream:#faf6f1; --white:#ffffff;
    --font:'Plus Jakarta Sans',system-ui,Segoe UI,sans-serif;
    --radius:18px; --shadow:0 18px 48px rgba(26,18,48,.10);
  }
  *{box-sizing:border-box} html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font);color:var(--text);background:var(--white);line-height:1.65;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--font);color:var(--ink);line-height:1.18;margin:0 0 .5em;font-weight:800;letter-spacing:-.01em}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .eyebrow{color:var(--bronze);font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:.78rem;margin-bottom:.6rem}
  .btn{display:inline-block;background:var(--bronze);color:#fff;font-weight:700;padding:.85rem 1.7rem;border-radius:999px;transition:.2s;border:none;cursor:pointer;font-family:var(--font);font-size:.95rem}
  .btn:hover{background:var(--bronze-dark);transform:translateY(-2px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.teal{background:var(--teal)} .btn.teal:hover{background:var(--teal-dark)}
  section{padding:84px 0}
  .lead{font-size:1.05rem;max-width:640px}

  /* Header */
  header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:24px;height:78px}
  .logo img{height:46px}
  nav.main{display:flex;gap:26px;align-items:center}
  nav.main a{font-weight:600;color:var(--ink);font-size:.93rem}
  nav.main a:hover{color:var(--bronze)}
  .navtoggle{display:none;background:none;border:none;font-size:1.6rem;color:var(--ink);cursor:pointer}

  /* Hero */
  .hero{background:linear-gradient(135deg,#1a1230 0%,#2b2147 60%,#3a2c4f 100%);color:#fff;text-align:center;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(56,197,181,.22),transparent 45%),radial-gradient(circle at 15% 85%,rgba(196,146,107,.28),transparent 45%)}
  .hero .wrap{position:relative;z-index:2}
  .hero .eyebrow{color:var(--teal)}
  .hero h1{color:#fff;font-size:clamp(2.2rem,5vw,3.7rem);max-width:14ch;margin-inline:auto}
  .hero p{color:#e7e0f0;max-width:540px;margin:1rem auto 1.8rem;font-size:1.08rem}

  /* Feature slides */
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .feat{background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:30px;transition:.25s}
  .feat:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
  .feat h3{font-size:1.3rem}
  .feat .ico{width:46px;height:46px;border-radius:12px;background:var(--bronze);margin-bottom:16px;display:grid;place-items:center;color:#fff;font-weight:800}

  /* Welcome */
  .center{text-align:center;max-width:760px;margin:0 auto}
  .center h2{font-size:clamp(1.8rem,3.5vw,2.5rem)}

  /* Value props */
  .vp{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:10px}
  .vp .card{text-align:center;padding:34px 26px;border-radius:var(--radius);background:#fff;border:1px solid var(--line)}
  .vp .num{width:54px;height:54px;border-radius:50%;background:rgba(56,197,181,.14);color:var(--teal-dark);display:grid;place-items:center;margin:0 auto 16px;font-weight:800;font-size:1.2rem}

  /* Practitioner */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center}
  .split img{border-radius:var(--radius);box-shadow:var(--shadow)}
  .split h2{font-size:clamp(1.8rem,3.4vw,2.4rem)}
  .split .name{color:var(--bronze);font-weight:700;font-size:1.15rem;margin-bottom:.8rem}

  /* Treatments */
  .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  .tcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.25s;display:flex;flex-direction:column}
  .tcard:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
  .tcard .ph{aspect-ratio:4/3;overflow:hidden}
  .tcard .ph img{width:100%;height:100%;object-fit:cover;transition:.4s}
  .tcard:hover .ph img{transform:scale(1.06)}
  .tcard .body{padding:24px;display:flex;flex-direction:column;flex:1}
  .tcard h3{font-size:1.18rem}
  .tcard p{font-size:.93rem;margin-bottom:18px}
  .tcard .more{margin-top:auto;color:var(--bronze);font-weight:700;font-size:.9rem}

  /* Steps */
  .steps{background:var(--cream)}
  .stepgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:30px}
  .step .n{font-size:2.6rem;font-weight:800;color:var(--bronze);opacity:.55}
  .step h3{margin-top:.2rem}

  /* Testimonials */
  .tst{background:var(--ink);color:#fff}
  .tst h2,.tst .eyebrow{color:#fff}
  .tst .eyebrow{color:var(--teal)}
  .tcols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}
  .quote{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:32px}
  .quote p{color:#e7e0f0;font-style:italic}
  .quote .stars{color:var(--gold);letter-spacing:3px;margin-bottom:10px}
  .quote .who{color:#fff;font-weight:700;margin-top:14px}

  /* Final CTA */
  .finalcta{background:linear-gradient(135deg,var(--bronze),var(--bronze-dark));color:#fff;text-align:center}
  .finalcta h2{color:#fff;font-size:clamp(1.9rem,3.6vw,2.6rem)}

  /* Footer */
  footer.site{background:var(--ink-2);color:#cfc7da;padding:64px 0 28px}
  footer.site .cols{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:40px}
  footer.site img.flogo{height:50px;margin-bottom:18px}
  footer.site h4{color:#fff;font-size:1rem;letter-spacing:.04em;margin-bottom:16px}
  footer.site a:hover{color:var(--bronze)}
  footer.site .soc{display:flex;gap:12px;margin-top:16px}
  footer.site .soc a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#fff}
  footer.site .soc a:hover{background:var(--bronze)}
  .fbot{border-top:1px solid rgba(255,255,255,.1);margin-top:40px;padding-top:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}

  /* Deals modal */
  .modal{position:fixed;inset:0;background:rgba(17,12,29,.7);display:none;place-items:center;z-index:90;padding:20px}
  .modal.open{display:grid}
  .modal .box{background:#fff;border-radius:var(--radius);max-width:760px;width:100%;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow)}
  .modal .box img{height:100%;object-fit:cover}
  .modal .mc{padding:34px}
  .modal .mc .eyebrow{color:var(--teal-dark)}
  .modal ul{padding-left:18px;margin:14px 0 22px}
  .modal .dismiss{display:block;background:none;border:none;color:var(--muted);margin-top:14px;cursor:pointer;font-family:var(--font);text-decoration:underline}

  .baseline-flag{position:fixed;left:12px;bottom:12px;z-index:80;background:var(--ink);color:#fff;font-size:.72rem;padding:7px 12px;border-radius:999px;opacity:.85;font-weight:600}
  .deals-fab{position:fixed;right:16px;bottom:16px;z-index:80;background:var(--bronze);color:#fff;border:none;font-family:var(--font);font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;font-size:.9rem}
  .deals-fab:hover{background:var(--bronze-dark);transform:translateY(-2px)}

  @media(max-width:900px){
    nav.main{display:none} .navtoggle{display:block}
    .features,.vp,.tgrid,.stepgrid,.tcols,.split,footer.site .cols,.modal .box{grid-template-columns:1fr}
    .split{gap:30px} .modal .box img{display:none} section{padding:60px 0}
  }
</style>
</head>
<body>
<div id="app"><noscript>This baseline preview renders from manifest.json and requires JavaScript.</noscript></div>
<div class="baseline-flag">Baseline capture — current site, no redesign</div>

<script>
const J = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const BOOK = "https://www.optimantra.com/optimus/om/patient/login";

fetch('manifest.json').then(r=>r.json()).then(render).catch(e=>{
  document.getElementById('app').innerHTML =
    '<div style="padding:80px 24px;text-align:center"><h2>Could not load manifest.json</h2><p>'+J(e.message)+'</p></div>';
});

function render(m){
  const t = m.treatments, hs = m.homepage.sections, byId = id => hs.find(s=>s.id===id);
  const slides = byId('feature-slides').slides, vp = byId('value-props').items,
        pr = byId('practitioner'), steps = byId('steps'), deals = byId('deals-modal'),
        welcome = byId('welcome'), tstSec = byId('testimonials');

  const nav = m.navigation.filter(n=>!n.cta && n.id!=='home').map(n=>{
    const href = n.path && n.path!=='booking' ? ('https://www.optimaljoylife.com'+(n.path.startsWith('http')?'':n.path)) : '#';
    return `<a href="${n.path&&n.path.startsWith('http')?n.path:'#'+(n.id)}">${J(n.label)}</a>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <header class="site"><div class="wrap bar">
    <a class="logo" href="#top"><img src="${m.brand.logos[0].localPath}" alt="${J(m.site.name)}"></a>
    <nav class="main">${nav}<a href="#treatments">Services</a><a href="#practitioner">About</a><a href="#contact">Contact</a></nav>
    <a class="btn" href="${BOOK}" target="_blank" rel="noopener">Book Appointment</a>
    <button class="navtoggle" onclick="document.querySelector('nav.main').style.display='flex'">&#9776;</button>
  </div></header>

  <a id="top"></a>
  <section class="hero"><div class="wrap">
    <div class="eyebrow">${J(byId('hero').tagline)}</div>
    <h1>${J(byId('hero').heading)}</h1>
    <p>${J(welcome.body)}</p>
    <a class="btn teal" href="${BOOK}" target="_blank" rel="noopener">${J(byId('hero').cta)}</a>
  </div></section>

  <section><div class="wrap">
    <div class="features">${slides.map((s,i)=>`
      <div class="feat"><div class="ico">${i+1}</div><h3>${J(s.title)}</h3><p>${J(s.body)}</p>
      <a class="more" style="color:var(--bronze);font-weight:700" href="#treatments">Learn More &rarr;</a></div>`).join('')}</div>
  </div></section>

  <section style="background:var(--cream)"><div class="wrap center">
    <div class="eyebrow">${J(m.site.tagline)}</div>
    <h2>${J(welcome.heading)}</h2>
    <p class="lead" style="margin-inline:auto">${J(welcome.body)}</p>
  </div></section>

  <section><div class="wrap">
    <div class="vp">${vp.map((v,i)=>`<div class="card"><div class="num">${i+1}</div><h3>${J(v.title)}</h3><p>${J(v.body)}</p></div>`).join('')}</div>
  </div></section>

  <section id="practitioner"><div class="wrap split">
    <img src="${pr.image}" alt="${J(pr.name)}">
    <div><div class="eyebrow">${J(pr.eyebrow)}</div><h2>${J(pr.name)}</h2>
    <p class="lead">${J(pr.body)}</p>
    <a class="btn" style="margin-top:14px" href="${BOOK}" target="_blank" rel="noopener">Book With Traci</a></div>
  </div></section>

  <section id="treatments" style="background:var(--cream)"><div class="wrap">
    <div class="center"><div class="eyebrow">What We Offer</div><h2>${J(byId('treatments').heading)}</h2></div>
    <div class="tgrid" style="margin-top:36px">${t.map(x=>`
      <div class="tcard"><div class="ph"><img src="${x.image}" alt="${J(x.name)}" loading="lazy"></div>
      <div class="body"><h3>${J(x.name)}</h3><p>${J(x.blurb)}</p>
      <a class="more" href="https://www.optimaljoylife.com${x.path}" target="_blank" rel="noopener">Learn More &rarr;</a></div></div>`).join('')}</div>
  </div></section>

  <section class="steps"><div class="wrap">
    <div class="center"><div class="eyebrow">Simple Process</div><h2>${J(steps.heading)}</h2><p class="lead" style="margin-inline:auto">${J(steps.intro)}</p></div>
    <div class="stepgrid">${steps.steps.map(s=>`<div class="step"><div class="n">${J(s.num)}</div><h3>${J(s.title)}</h3><p>${J(s.body)}</p></div>`).join('')}</div>
  </div></section>

  <section class="tst"><div class="wrap">
    <div class="center"><div class="eyebrow">${J(tstSec.heading)}</div><h2>${J(tstSec.subheading)}</h2></div>
    <div class="tcols">${m.testimonials.map(q=>`<div class="quote"><div class="stars">${'★'.repeat(q.rating||5)}</div><p>&ldquo;${J(q.quote)}&rdquo;</p><div class="who">${J(q.name)}</div></div>`).join('')}</div>
  </div></section>

  <section class="finalcta"><div class="wrap">
    <h2>${J(byId('final-cta').heading)}</h2>
    <a class="btn ghost" style="background:#fff;border:none;margin-top:18px" href="${BOOK}" target="_blank" rel="noopener">${J(byId('final-cta').cta)}</a>
  </div></section>

  <footer class="site" id="contact"><div class="wrap">
    <div class="cols">
      <div><img class="flogo" src="${m.brand.logos[1].localPath}" alt="${J(m.site.name)}">
        <p>${J(m.footer.description)}</p>
        <div class="soc">${m.social.map(s=>`<a href="${s.url}" target="_blank" rel="noopener" title="${J(s.platform)}">${s.platform[0]}</a>`).join('')}</div></div>
      <div><h4>Contact</h4>
        <p><strong>${J(m.contact.phone)}</strong><br><span style="color:var(--muted)">${J(m.contact.phoneNote)}</span></p>
        <p><a href="mailto:${m.contact.email}">${J(m.contact.email)}</a></p>
        <p>${J(m.contact.address.street)}<br>${J(m.contact.address.city)}, ${J(m.contact.address.state)} ${J(m.contact.address.zip)}</p>
        <p>${J(m.contact.hours)}</p></div>
      <div><h4>Quick Links</h4>
        ${m.navigation[1].children.map(c=>`<p><a href="https://www.optimaljoylife.com${c.path}" target="_blank" rel="noopener">${J(c.label)}</a></p>`).join('')}</div>
    </div>
    <div class="fbot">
      <div>&copy; ${J(m.meta.generated.slice(0,4))} ${J(m.site.name)}. ${m.footer.legal.map(l=>`<a href="https://www.optimaljoylife.com${l.path}" target="_blank" rel="noopener" style="margin-left:10px">${J(l.label)}</a>`).join('')}</div>
      <div>${J(m.footer.designCredit)}</div>
    </div>
  </div></footer>

  <button class="deals-fab" onclick="document.getElementById('deals').classList.add('open')">&#10022; ${J(deals.subheading)}</button>
  <div class="modal" id="deals">
    <div class="box">
      <img src="${deals.image}" alt="${J(deals.subheading)}">
      <div class="mc">
        <div class="eyebrow">${J(deals.subheading)}</div>
        <h3 style="font-size:1.6rem">${J(deals.heading)}</h3>
        <p>${J(deals.body)}</p>
        <ul>${deals.bullets.map(b=>`<li>${J(b)}</li>`).join('')}</ul>
        <a class="btn teal" href="https://www.optimaljoylife.com/deals-and-promotions/" target="_blank" rel="noopener">${J(deals.cta)}</a>
        <button class="dismiss" onclick="document.getElementById('deals').classList.remove('open')">${J(deals.dismiss)}</button>
      </div>
    </div>
  </div>`;
}
</script>
</body>
</html>
